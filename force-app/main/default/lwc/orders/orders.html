<template>
    <!--
        Si le compte n'a pas de commandes ou si le montant total
        est inférieur ou égal à 0, on affiche le message d'erreur.
    -->
    <template lwc:if={hasError}>
        <div class="slds-box slds-theme_error">
            <h1>
                Erreur : pas de commandes rattachées à ce compte
                ou le montant total des commandes est inférieur ou égal à 0.
            </h1>
        </div>
    </template>

    <!--
        Si aucune erreur n'est détectée, on affiche le montant
        total des commandes rattachées au compte.
    -->
    <template lwc:else>
        <div class="slds-box slds-theme_success">
            <h1>
                Total des Commandes : {sumOrdersOfCurrentAccount}
            </h1>
        </div>
    </template>
</template>
